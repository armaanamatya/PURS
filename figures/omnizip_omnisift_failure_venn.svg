<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">OmniZip and OmniSIFT failure-case Venn diagram</title>
  <desc id="desc">A two-circle Venn diagram comparing failure cases for OmniZip, OmniSIFT, and shared cross-modal pruning failure modes.</desc>

  <rect width="1280" height="860" fill="#faf8f2"/>

  <circle cx="430" cy="525" r="300" fill="#6ea8d9" fill-opacity="0.34" stroke="#3f79a8" stroke-width="4"/>
  <circle cx="800" cy="525" r="300" fill="#efb167" fill-opacity="0.34" stroke="#cf8532" stroke-width="4"/>

  <text x="310" y="125" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#2f628c">OmniZip</text>
  <text x="315" y="163" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#2f628c">audio-guided</text>
  <text x="810" y="125" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#a86418">OmniSIFT</text>
  <text x="830" y="163" font-family="Helvetica, Arial, sans-serif" font-size="22" font-style="italic" fill="#a86418">vision-guided</text>
  <text x="615" y="304" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#3c3c3c">Shared Limits</text>

  <text x="165" y="368" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">
    <tspan x="165" dy="0">Silent visual cues:</tspan>
    <tspan x="165" dy="26">Text, scoreboards,</tspan>
    <tspan x="165" dy="26">visual gags.</tspan>
    <tspan x="165" dy="40">Generic audio:</tspan>
    <tspan x="165" dy="26">B-roll, diagrams,</tspan>
    <tspan x="165" dy="26">music beds.</tspan>
    <tspan x="165" dy="40">Noisy / misaligned audio:</tspan>
    <tspan x="165" dy="26">Crowd noise,</tspan>
    <tspan x="165" dy="26">lagging narration.</tspan>
  </text>

  <text x="615" y="368" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">
    <tspan x="615" dy="0">Dense clips:</tspan>
    <tspan x="615" dy="26">Almost everything matters.</tspan>
    <tspan x="615" dy="40">Micro-events:</tspan>
    <tspan x="615" dy="26">Tiny decisive moments.</tspan>
    <tspan x="615" dy="40">A/V mismatch:</tspan>
    <tspan x="615" dy="26">Lip-sync, dubbing,</tspan>
    <tspan x="615" dy="26">deepfakes.</tspan>
  </text>

  <text x="955" y="368" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">
    <tspan x="955" dy="0">Audio-dominant clips:</tspan>
    <tspan x="955" dy="26">Podcasts,</tspan>
    <tspan x="955" dy="26">static heads.</tspan>
    <tspan x="955" dy="40">Off-screen sounds:</tspan>
    <tspan x="955" dy="26">Heard, not seen.</tspan>
    <tspan x="955" dy="40">Visual distraction:</tspan>
    <tspan x="955" dy="26">Busy motion masks</tspan>
    <tspan x="955" dy="26">speech.</tspan>
  </text>
</svg>
